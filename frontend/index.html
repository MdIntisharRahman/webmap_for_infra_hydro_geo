<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RHD Infrastructure Webmap</title>
    <link rel="stylesheet" href="resources/leaflet.css" />
    <link rel="stylesheet" href="resources/fonts.css" />
    <link rel="stylesheet" href="styles.css?v=71">

    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="map"></div>

    <!-- Small Header -->

    <header class="app-header">
        <div  class="logo">
            <img src="resources/images/RHD_Logo.png" alt="RHD Logo">
            <!-- RHD -->
            <!-- <img src="resources/images/RHD_Logo.png" alt="RHD Logo"> -->
        </div>
        <div class="header-titles">
            <h1>INFRASTRUCTURE & GEO-HYDRO PORTAL</h1>
            <!-- <h1>INFRASTRUCTURE & GEO PORTAL</h1> -->
            <p>RHD Bridge Engineering Units</p>
        </div>
    </header>


    <!-- Left Hover Control Panel -->
    <div class="side-panel-container" tabindex="0">
        <div class="side-panel">
            <div class="side-header">
                <h2>MAP CONTROLS</h2>
                <div id="pin-btn" class="pin-btn" title="Pin Panel">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 17v5"></path>
                        <path d="M9 10.5V7a3 3 0 0 1 6 0v3.5l2 4.5H7z"></path>
                    </svg>
                </div>
            </div>
            <div class="tabs-and-content">
                <div id="dynamic-tabs-container" class="fluid-tabs vertical-tabs">
                    <!-- Dynamic tabs generated by JS will go here -->
                </div>
                <div id="tab-content-area" class="side-layer-list">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <span>Loading maps...</span>
                    </div>
                </div>
            </div>
            <div class="coord-tool">
                <h3>Point Data Estimator</h3>
                <div class="coord-inputs">
                    <input type="text" id="coord-input" placeholder="e.g. 23.66, 91.06 or 23 45 33, 91 07 45">
                    <button id="target-btn" title="Pick coordinate from map" aria-label="Pick coordinate from map">
                        <img src="resources/images/target-aim.svg" width="22" height="22" alt="Target icon">
                    </button>
                </div>
                <button id="coord-btn">Place Marker</button>
            </div>
        </div>
    </div>
    
    <!-- Right Hover Control Panel (Second Panel for extended legends) -->
    <div class="right-panel-container" id="right-panel-container" tabindex="0">
        <div class="side-panel right-panel">
            <div id="right-panel-content" class="side-layer-list right-panel-content">
                <!-- Extended legend items go here -->
            </div>
            <div class="side-header right-panel-footer">
                <h2 id="right-panel-title">Layer Name</h2>
                <div id="right-pin-btn" class="pin-btn pinned-active" title="Pin Panel">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 17v5"></path>
                        <path d="M9 10.5V7a3 3 0 0 1 6 0v3.5l2 4.5H7z"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    
    
    <div id="borelog-modal" class="iframe-modal hidden" style="z-index: 10000;">
        <div class="iframe-modal-backdrop" onclick="document.getElementById('borelog-modal').classList.add('hidden')"></div>
        <div class="iframe-modal-content approval-modal-content">
            <button class="iframe-modal-close absolute-close-btn" onclick="document.getElementById('borelog-modal').classList.add('hidden')" aria-label="Close"></button>
            <div id="borelog-react-root"></div>
        </div>
    </div>

    <!-- Visualizer Template -->
    <template id="visualizer-template">
        <div id="my-custom-wrapper" class="visualizer-outer-layer" data-state="active" style="display: flex; flex-direction: column; height: 100%; box-sizing: border-box; max-height: 91vh;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px;">
                <h2 style="margin:0; font-size: 20px; font-weight: bold; color: #1e293b;" id="visualizer-title"></h2>
                <div style="display: flex; gap: 9px; align-items: center;">
                        <button id="export-graphic-btn" class="blue_button export-graphic-btn-class">
                            Export Graphic
                        </button>
                        <button id="export-xlsx-btn" class="teal_button export-xlsx-btn-class">
                            Export XLSX
                        </button>
                    </div>
                    <button class="iframe-modal-close" style="margin-left: 12px;" onclick="document.getElementById('borelog-modal').classList.add('hidden')" aria-label="Close"></button>
            </div>
            <div id="borelog-visualizer-container" style="width: 100%; height: 81vh; max-height: 87vh; overflow: hidden; display: flex; flex: 1 1 0%; min-height: 0; flex-direction: column; padding: 3px;"></div>
        </div>
    </template>

    <!-- Iframe Modal -->
    <div id="iframe-modal" class="iframe-modal hidden">
        <div class="iframe-modal-backdrop" id="iframe-modal-backdrop"></div>
        <div class="iframe-modal-content">
            <button class="iframe-modal-close absolute-close-btn" id="iframe-modal-close" aria-label="Close modal"></button>
            <iframe id="iframe-modal-frame" src="" frameborder="0"></iframe>
        </div>
    </div>

    <!-- Custom Tooltip -->
    <div id="tooltip" class="tooltip hidden">
        <div class="tooltip-header">
            <span class="rhd-ref" id="tooltip-ref"></span>
            <span class="layer-badge" id="tooltip-layer"></span>
        </div>
        <div class="tooltip-body">
            <h3 id="tooltip-name"></h3>
            <div class="tooltip-details" id="tooltip-details">
                <!-- Additional properties dumped here -->
            </div>
        </div>
    </div>

    <script src="resources/leaflet.js"></script>
    <script src="resources/marked.min.js"></script>
    <script src="app.js?v=71"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=124d1af6-b914-4cb8-b54e-50f309aab01d"></script>
<!-- impeccable-live-end -->

    <script src="resources/pastel_generator.js"></script>
    <script src="resources/MultiTab_XLSX_Export_Engine.js?v=2"></script>
    <script src="resources/BorelogVisualizer.js?v=2"></script>
</body>
</html>
