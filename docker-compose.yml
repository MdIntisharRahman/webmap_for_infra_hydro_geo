version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webmap}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webmap}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      WEBMASTER_USERNAME: ${WEBMASTER_USERNAME}
      WEBMASTER_PASSWORD: ${WEBMASTER_PASSWORD}
      BDD1_USERNAME: ${BDD1_USERNAME:-bdd_1}
      BDD1_PASSWORD: ${BDD1_PASSWORD:-bdd1_rhd_bridge_2026}
      BDD2_USERNAME: ${BDD2_USERNAME:-bdd_2}
      BDD2_PASSWORD: ${BDD2_PASSWORD:-bdd2_rhd_bridge_2026}
      BDD3_USERNAME: ${BDD3_USERNAME:-bdd_3}
      BDD3_PASSWORD: ${BDD3_PASSWORD:-bdd3_rhd_bridge_2026}
      DESC_BASE_URL: ${DESC_BASE_URL:-${ADDS_BASE_URL:-https://acqform.rhdbridge.com}}
      ADDS_BASE_URL: ${DESC_BASE_URL:-${ADDS_BASE_URL:-https://acqform.rhdbridge.com}}
    volumes:
      - ./Maps:/app/Maps
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8002:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
